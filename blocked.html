<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Focus session active — Tranquil</title>
    <link rel="stylesheet" href="blocked.css" />
  </head>
  <body>
    <main>
      <div class="mark" aria-hidden="true">◌</div>
      <p class="eyebrow" id="status-label">Focus session active</p>
      <h1 id="heading">Stay with the one thing.</h1>
      <p class="copy" id="copy"><span id="site-name">This site</span> can wait. You chose this time before the impulse arrived.</p>
      <div class="timer" id="timer">30:00</div>
      <p class="ends" id="ends-at"></p>
      <div class="progress"><span id="progress-bar"></span></div>
      <a id="access-link" hidden>Open site</a>
    </main>
    <script src="blocked.js"></script>
  </body>
</html>
